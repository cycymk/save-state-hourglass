# 推送到 main 或 dev 都會重新發布 GitHub Pages：
#   main → https://cycymk.github.io/save-state-hourglass/        （正式版，孩子日常使用）
#   dev  → https://cycymk.github.io/save-state-hourglass/beta/   （每週新版，家長先試玩）
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: dev
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r main/app/. _site/
          if [ -d dev/app ]; then mkdir -p _site/beta && cp -r dev/app/. _site/beta/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
